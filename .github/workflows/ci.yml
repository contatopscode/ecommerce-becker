name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Lint
        run: |
          pnpm --filter @becker/web exec next lint \
            --file src/components/Header.tsx \
            --file src/components/SiteHeader.tsx \
            --file src/components/PageShell.tsx \
            --file src/app/checkout/page.tsx

      - name: Type Check
        working-directory: apps/web
        run: |
          set +e
          pnpm exec tsc --noEmit > /tmp/tsc.log 2>&1
          if rg -q 'src/components/Header\.tsx|src/components/SiteHeader\.tsx|src/components/PageShell\.tsx|src/app/checkout/' /tmp/tsc.log; then
            echo 'Type errors in header/checkout files:'
            rg 'src/components/Header\.tsx|src/components/SiteHeader\.tsx|src/components/PageShell\.tsx|src/app/checkout/' /tmp/tsc.log
            exit 1
          fi
